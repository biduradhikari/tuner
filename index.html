<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuner</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1b;--mute:#8a867c;--card:#fff;--line:#d9d4c7;--ok:#2e9e5b;--warn:#e0a21a;--bad:#d4493a;--needle:#1d1d1b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--fg:#eee9dd;--mute:#7d796f;--card:#1c1c1a;--line:#33322e;--needle:#eee9dd}}
:root[data-theme="dark"]{--bg:#121211;--fg:#eee9dd;--mute:#7d796f;--card:#1c1c1a;--line:#33322e;--needle:#eee9dd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:20px 16px 28px;display:flex;flex-direction:column;gap:16px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:600 15px inherit;font-family:inherit;padding:10px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg)}
.meter{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 10px 18px;text-align:center;transition:box-shadow .25s,border-color .25s}
.meter.ok{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
svg{width:100%;height:auto;display:block}
#needle{transition:none}
.note{font-size:72px;font-weight:700;line-height:1;margin-top:-6px;letter-spacing:-2px;min-height:72px}
.note sub{font-size:26px;font-weight:600;color:var(--mute);letter-spacing:0;vertical-align:baseline}
.hint{font-size:16px;font-weight:600;margin-top:6px;min-height:22px;color:var(--mute)}
.hint.ok{color:var(--ok)}.hint.warn{color:var(--warn)}.hint.bad{color:var(--bad)}
.info{display:flex;justify-content:center;gap:22px;color:var(--mute);font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.strings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.str{flex:1;min-width:58px;max-width:90px;padding:10px 0;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;font:700 20px inherit;font-family:inherit;cursor:pointer;position:relative}
.str small{display:block;font-size:11px;font-weight:500;color:var(--mute);margin-top:2px}
.str.act{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.str.act small{color:var(--bg);opacity:.7}
.str.done::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.row button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.row button.on{background:var(--fg);color:var(--bg)}
#start{border:0;background:var(--fg);color:var(--bg);font:700 17px inherit;font-family:inherit;padding:16px;border-radius:14px;cursor:pointer}
#err{color:var(--bad);font-size:14px;text-align:center;min-height:0}
</style>
</head>
<body>
<main>
  <div class="seg" id="inst"></div>
  <div class="meter" id="meter">
    <svg viewBox="0 0 300 175" aria-hidden="true">
      <g id="ticks"></g>
      <path id="zone" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="butt" opacity=".85"/>
      <text x="22" y="30" fill="var(--mute)" font-size="15" font-weight="700" text-anchor="middle">♭</text>
      <text x="278" y="30" fill="var(--mute)" font-size="15" font-weight="700" text-anchor="middle">♯</text>
      <g id="needle"><line x1="150" y1="150" x2="150" y2="48" stroke="var(--needle)" stroke-width="3" stroke-linecap="round"/></g>
      <circle cx="150" cy="150" r="8" fill="var(--needle)"/>
    </svg>
    <div class="note" id="note">–</div>
    <div class="hint" id="hint">Tap start and play a string</div>
    <div class="info"><span id="hz">– Hz</span><span id="ct">– ¢</span></div>
  </div>
  <div class="strings" id="strings"></div>
  <div class="row">
    <span id="lockTxt">Auto-detect string</span>
    <button id="auto" class="on">Auto</button>
  </div>
  <div id="err"></div>
  <button id="start">Start tuning</button>
</main>
<script>
(function(){
var INST={
 "Guitar":[["E",2,82.41],["A",2,110.00],["D",3,146.83],["G",3,196.00],["B",3,246.94],["E",4,329.63]],
 "Ukulele":[["G",4,392.00],["C",4,261.63],["E",4,329.63],["A",4,440.00]],
 "Violin":[["G",3,196.00],["D",4,293.66],["A",4,440.00],["E",5,659.26]]
};
var cur="Guitar",auto=true,locked=-1,running=false;
var ctx,an,buf,stream,raf;
var hist=[],smooth=0,lastSig=0,prevRms=0,done={};
var $=function(i){return document.getElementById(i)};
var SW=60,R=120,CX=150,CY=150; // gauge spans ±60°, ±50 cents

function polar(deg,r){var a=(deg-90)*Math.PI/180;return[CX+r*Math.cos(a),CY+r*Math.sin(a)]}
function buildGauge(){
  var g="";
  for(var c=-50;c<=50;c+=5){
    var d=c/50*SW,major=c%25===0,p1=polar(d,R),p2=polar(d,R-(major?18:10));
    g+='<line x1="'+p1[0]+'" y1="'+p1[1]+'" x2="'+p2[0]+'" y2="'+p2[1]+'" stroke="var(--'+(c===0?'ok':'mute')+')" stroke-width="'+(major?2.5:1.5)+'" stroke-linecap="round"/>';
  }
  $("ticks").innerHTML=g;
  var a=polar(-5/50*SW,R-4),b=polar(5/50*SW,R-4);
  $("zone").setAttribute("d","M"+a[0]+" "+a[1]+" A "+(R-4)+" "+(R-4)+" 0 0 1 "+b[0]+" "+b[1]);
}
function buildUI(){
  var s="";Object.keys(INST).forEach(function(k){s+='<button data-i="'+k+'" class="'+(k===cur?"on":"")+'">'+(k==="Ukulele"?"Ukulele (C)":k)+'</button>'});
  $("inst").innerHTML=s;
  var h="";INST[cur].forEach(function(n,i){h+='<button class="str'+(i===locked?" act":"")+(done[cur+i]?" done":"")+'" data-s="'+i+'">'+n[0]+'<small>'+n[1]+'</small></button>'});
  $("strings").innerHTML=h;
}
$("inst").onclick=function(e){var k=e.target.dataset.i;if(!k)return;cur=k;locked=-1;done={};hist=[];buildUI();reset()};
$("strings").onclick=function(e){var b=e.target.closest(".str");if(!b)return;locked=+b.dataset.s;auto=false;hist=[];updMode();buildUI()};
$("auto").onclick=function(){auto=!auto;if(auto)locked=-1;hist=[];updMode();buildUI()};
function updMode(){$("auto").className=auto?"on":"";$("lockTxt").textContent=auto?"Auto-detect string":"Locked to string (tap Auto to release)"}

function reset(){
  hasSig=false;target=0;
  $("note").textContent="–";$("hz").textContent="– Hz";$("ct").textContent="– ¢";
  $("hint").className="hint";$("hint").textContent=running?"Play a string":"Tap start and play a string";
  $("meter").className="meter";
}

// YIN pitch detection
function yin(b,sr){
  var W=2048,T=1024,d=new Float32Array(T),i,t,s,x;
  for(t=1;t<T;t++){s=0;for(i=0;i<W;i++){x=b[i]-b[i+t];s+=x*x}d[t]=s}
  var run=0;d[0]=1;
  for(t=1;t<T;t++){run+=d[t];d[t]=d[t]*t/run}
  var tau=-1;
  for(t=20;t<T-1;t++){
    if(d[t]<0.12){while(t+1<T-1&&d[t+1]<d[t])t++;tau=t;break}
  }
  if(tau<0)return null;
  var a=d[tau-1],bb=d[tau],c=d[tau+1],den=a+c-2*bb,shift=den?(a-c)/(2*den):0;
  return sr/(tau+shift);
}
function nearest(f){
  var best=0,bd=1e9;
  INST[cur].forEach(function(n,i){var dd=Math.abs(1200*Math.log(f/n[2])/Math.LN2);if(dd<bd){bd=dd;best=i}});
  return best;
}
function median(a){var s=a.slice().sort(function(x,y){return x-y});return s[s.length>>1]}

var lastDet=0,target=0,pos=0,lastT=0,lastTxt=0;
function animate(now){
  var dt=Math.min(0.05,(now-(lastT||now))/1000);lastT=now;
  pos+=(target-pos)*(1-Math.exp(-dt/0.14));
  var d=Math.max(-50,Math.min(50,pos));
  $("needle").setAttribute("transform","rotate("+(d/50*SW)+" 150 150)");
  if(now-lastTxt>120&&hasSig){lastTxt=now;$("ct").textContent=(pos>0.5?"+":"")+Math.round(pos)+" ¢";$("hz").textContent=curF.toFixed(1)+" Hz"}
}
function tick(){
  raf=requestAnimationFrame(tick);
  var now=performance.now();
  animate(now);
  if(now-lastDet<40)return;
  lastDet=now;
  an.getFloatTimeDomainData(buf);
  var sum=0;for(var i=0;i<buf.length;i++)sum+=buf[i]*buf[i];
  var rms=Math.sqrt(sum/buf.length);
  var attack=rms>0.015&&rms>prevRms*2.2;prevRms=prevRms*0.8+rms*0.2;
  if(rms>0.008){
    var f=yin(buf,ctx.sampleRate);
    if(f&&f>50&&f<1200){
      lastSig=now;
      if(auto){
        if(attack&&locked>=0){var n=nearest(f);if(n!==locked&&Math.abs(1200*Math.log(f/INST[cur][n][2])/Math.LN2)<40){locked=n;hist=[];buildUI()}}
        if(locked<0){hist.push(nearest(f));if(hist.length>6)hist.shift();
          if(hist.length>=4&&hist.every(function(v){return v===hist[hist.length-1]})){locked=hist[hist.length-1];buildUI()}}
      }
      if(locked>=0)render(f);
    }
  }else if(now-lastSig>1500){
    target=0;cents=[];
    if(auto&&locked>=0){locked=-1;hist=[];buildUI();reset()}
  }
}
var cents=[],lastLk=-1,inTune=false,curF=0,hasSig=false;
function render(f){
  var n=INST[cur][locked],c=1200*Math.log(f/n[2])/Math.LN2;
  if(locked!==lastLk){cents=[];lastLk=locked;inTune=false}
  c=Math.max(-100,Math.min(100,c));
  cents.push(c);if(cents.length>9)cents.shift();
  var m=median(cents);
  if(!hasSig||Math.abs(m-target)>2)target=m;
  curF=f;hasSig=true;
  var nt=n[0]+"<sub>"+n[1]+"</sub>";if($("note").innerHTML!==nt)$("note").innerHTML=nt;
  var a=Math.abs(m),h=$("hint"),mt=$("meter");
  if(a<=(inTune?8:5)){inTune=true;h.className="hint ok";h.textContent="In tune ✓";mt.className="meter ok";done[cur+locked]=1;mark()}
  else{inTune=false;mt.className="meter";h.className="hint "+(a<15?"warn":"bad");h.textContent=m<0?"Too low – tighten ↑":"Too high – loosen ↓"}
}
function mark(){var b=$("strings").children[locked];if(b&&!b.classList.contains("done"))b.classList.add("done")}

$("start").onclick=function(){
  if(running){stop();return}
  $("err").textContent="";
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("err").textContent="Microphone is not available in this browser or context.";return}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
    stream=s;ctx=new (window.AudioContext||window.webkitAudioContext)();
    var src=ctx.createMediaStreamSource(s);an=ctx.createAnalyser();an.fftSize=4096;an.smoothingTimeConstant=0;
    buf=new Float32Array(an.fftSize);src.connect(an);
    running=true;$("start").textContent="Stop";reset();tick();
  }).catch(function(){$("err").textContent="Microphone access was blocked. Allow it in your browser settings and try again."});
};
function stop(){
  cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(function(t){t.stop()});
  if(ctx)ctx.close();running=false;$("start").textContent="Start tuning";
  if(auto)locked=-1;buildUI();reset();
  $("needle").setAttribute("transform","rotate(0 150 150)");
}
buildGauge();buildUI();updMode();
})();
</script>
</body>
</html>
